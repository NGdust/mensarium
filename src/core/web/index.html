  <!--
  THESIS: delegation is one sentence away; the chat is the product and everything else stays folded until it needs the owner. Refuses the admin-dashboard default of stat cards and tables on the landing view.
  OWN-WORLD: black frame, one inset panel lit from above by a plum haze, pill controls with hairline borders, a living particle sphere (orb.js) as the agent's face, flat violet buttons without glow; dark only, Onest (self-hosted, Cyrillic) at light display weights, mono only for commands and paths.
  STORY: the owner sees what the agent can act on (device, access mode), writes the task, watches steps fold by, and answers only approvals and errors.
  FIRST VIEWPORT: new chat centers the large orb over "Что нужно сделать?", task templates above a composer card holding device and mode chips and the send orb; chat view puts the composer at the bottom and approvals inline where the agent waits.
  FORM: pinned by the owner's style reference (owner: "Референс чисто по стилю"); the owner's pin replaces the concept roll, so there is no seed key.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
  -->
  <div id="app"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="layer"></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
