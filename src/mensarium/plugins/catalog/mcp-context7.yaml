id: mcp-context7
name: Context7
version: 1.0.0
author: Upstash
summary:
  en: Up-to-date library documentation and code examples for the agent.
  ru: Свежая документация библиотек и примеры кода для агента.
description:
  en: Connects the Core to the hosted Context7 MCP server so the agent can look up current docs for frameworks and libraries instead of relying on memory. Works without a key; a key raises the rate limit.
  ru: Подключает Core к облачному MCP-серверу Context7, чтобы агент сверялся с актуальной документацией фреймворков и библиотек, а не полагался на память. Работает без ключа, ключ поднимает лимит запросов.
tags: [mcp, docs]
homepage: https://context7.com
config:
  api_key:
    secret: true
    title: {en: API key (optional), ru: Ключ API (необязательно)}
mcp:
  transport: http
  url: https://mcp.context7.com/mcp
  headers:
    CONTEXT7_API_KEY: "{api_key}"
  risk: read
