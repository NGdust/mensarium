id: mcp-sentry
name: Sentry
version: 2.0.0
author: Sentry
summary:
  en: Search and read Sentry issues, events and projects.
  ru: Поиск и чтение issues, событий и проектов Sentry.
description:
  en: Connects to Sentry's hosted MCP server. Sign in with the Connect button. The Core registers itself with Sentry and keeps the tokens, nothing to copy by hand. Read-only. Self-hosted Sentry is not covered.
  ru: Подключается к облачному MCP-серверу Sentry. Войдите кнопкой Connect. Core сам регистрируется в Sentry и хранит токены, копировать вручную ничего не нужно. Только чтение. Self-hosted Sentry не поддерживается.
tags: [mcp, sentry, observability, errors]
category: observability
homepage: https://github.com/getsentry/sentry-mcp
mcp:
  transport: http
  url: https://mcp.sentry.dev/mcp
  risk: read
oauth:
  discover: true
