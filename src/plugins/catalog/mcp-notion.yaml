id: mcp-notion
name: Notion
version: 2.0.0
author: Notion
summary:
  en: Search, read and edit Notion pages and databases through Notion's official MCP server.
  ru: Поиск, чтение и правка страниц и баз данных Notion через официальный MCP-сервер Notion.
description:
  en: Connects to Notion's hosted MCP server. Sign in with the Connect button. The Core registers itself with Notion and keeps the tokens, nothing to copy by hand. Writes to Notion go through approval unless you lower the risk.
  ru: Подключается к облачному MCP-серверу Notion. Войдите кнопкой Connect. Core сам регистрируется в Notion и хранит токены, копировать вручную ничего не нужно. Запись в Notion идёт через подтверждение, если не понизить риск.
tags: [mcp, notion, productivity]
category: productivity
homepage: https://github.com/makenotion/notion-mcp-server
mcp:
  transport: http
  url: https://mcp.notion.com/mcp
  risk: write
oauth:
  discover: true
