id: mcp-atlassian
name: Atlassian
version: 1.0.0
author: Community
summary:
  en: Search and read Jira issues and Confluence pages through the community mcp-atlassian server.
  ru: Поиск и чтение задач Jira и страниц Confluence через community-сервер mcp-atlassian.
description:
  en: Runs mcp-atlassian with uvx. Jira and Confluence are configured independently, fill in only the fields for the product you use and leave the other blank. All fields are optional, but at least one product needs to be configured for any tools to appear. Tokens stay in the Core.
  ru: Запускает mcp-atlassian через uvx. Jira и Confluence настраиваются независимо, заполните только поля нужного продукта, остальные оставьте пустыми. Все поля необязательны, но хотя бы один продукт должен быть настроен, чтобы появились инструменты. Токены хранятся в Core.
tags: [mcp, jira, confluence, atlassian]
category: productivity
homepage: https://github.com/sooperset/mcp-atlassian
config:
  jira_url:
    title: {en: Jira URL, ru: URL Jira}
    placeholder: "https://your-domain.atlassian.net"
  jira_username:
    title: {en: Jira username (email), ru: Имя пользователя Jira (email)}
  jira_api_token:
    secret: true
    title: {en: Jira API token, ru: API-токен Jira}
    help: {en: "https://id.atlassian.com/manage-profile/security/api-tokens", ru: "https://id.atlassian.com/manage-profile/security/api-tokens"}
  confluence_url:
    title: {en: Confluence URL, ru: URL Confluence}
    placeholder: "https://your-domain.atlassian.net/wiki"
  confluence_username:
    title: {en: Confluence username (email), ru: Имя пользователя Confluence (email)}
  confluence_api_token:
    secret: true
    title: {en: Confluence API token, ru: API-токен Confluence}
    help: {en: "https://id.atlassian.com/manage-profile/security/api-tokens", ru: "https://id.atlassian.com/manage-profile/security/api-tokens"}
mcp:
  command: uvx
  args: [mcp-atlassian]
  env:
    JIRA_URL: "{jira_url}"
    JIRA_USERNAME: "{jira_username}"
    JIRA_API_TOKEN: "{jira_api_token}"
    CONFLUENCE_URL: "{confluence_url}"
    CONFLUENCE_USERNAME: "{confluence_username}"
    CONFLUENCE_API_TOKEN: "{confluence_api_token}"
  risk: write
