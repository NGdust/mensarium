id: mcp-atlassian
name: Atlassian
version: 2.0.0
author: Atlassian
summary:
  en: Search and read Jira issues and Confluence pages through Atlassian's hosted MCP server.
  ru: Поиск и чтение задач Jira и страниц Confluence через облачный MCP-сервер Atlassian.
description:
  en: Connects to Atlassian's hosted MCP server for Jira and Confluence Cloud. Sign in with the Connect button. The Core registers itself with Atlassian and keeps the tokens, nothing to copy by hand. Self-hosted Jira and Confluence are not covered. Writes go through approval unless you lower the risk.
  ru: Подключается к облачному MCP-серверу Atlassian для Jira и Confluence Cloud. Войдите кнопкой Connect. Core сам регистрируется в Atlassian и хранит токены, копировать вручную ничего не нужно. Self-hosted Jira и Confluence не поддерживаются. Запись идёт через подтверждение, если не понизить риск.
tags: [mcp, jira, confluence, atlassian]
category: productivity
homepage: https://www.atlassian.com/platform/remote-mcp-server
mcp:
  transport: http
  url: https://mcp.atlassian.com/v1/mcp
  risk: write
oauth:
  discover: true
