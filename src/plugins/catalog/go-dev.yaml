id: go-dev
name: {en: Go dev tools, ru: Инструменты Go-разработки}
version: 1.0.0
author: Mensarium
summary:
  en: Run go test, go vet and go build as dedicated tools.
  ru: Запускает go test, go vet и go build отдельными инструментами.
description:
  en: Gives the agent structured tools for a Go project's tests, static analysis and build, scoped to a package pattern that defaults to the whole module.
  ru: Даёт агенту инструменты для тестов, статического анализа и сборки Go-проекта с областью действия по шаблону пакетов, по умолчанию — весь модуль.
tags: [go, testing, lint]
category: development
tools:
  - name: go.test
    description: Run go test for the given packages (defaults to ./...).
    risk: execute
    argv: [go, test, "{packages}"]
    cwd: "{dir}"
    parameters:
      dir: {description: Project directory, default: "."}
      packages: {description: Package pattern to test, default: "./..."}
  - name: go.vet
    description: Run go vet across the given packages (defaults to ./...).
    risk: read
    argv: [go, vet, "{packages}"]
    cwd: "{dir}"
    parameters:
      dir: {description: Project directory, default: "."}
      packages: {description: Package pattern to vet, default: "./..."}
  - name: go.build
    description: Build the given packages (defaults to ./...).
    risk: execute
    argv: [go, build, "{packages}"]
    cwd: "{dir}"
    parameters:
      dir: {description: Project directory, default: "."}
      packages: {description: Package pattern to build, default: "./..."}
