id: mcp-time
name: {en: Time and time zones, ru: Время и часовые пояса}
version: 1.0.0
author: Model Context Protocol
summary:
  en: Current time and conversions between time zones.
  ru: Текущее время и перевод между часовыми поясами.
description:
  en: Runs the reference mcp-server-time with uvx in the Core. Useful when the agent schedules, reads logs from other regions or needs today's date.
  ru: Запускает эталонный mcp-server-time через uvx в Core. Пригодится, когда агент планирует, читает логи из других регионов или ему нужна сегодняшняя дата.
tags: [mcp, time]
category: productivity
homepage: https://github.com/modelcontextprotocol/servers/tree/main/src/time
config:
  timezone:
    placeholder: Europe/Moscow
    title: {en: Local time zone, ru: Местный часовой пояс}
mcp:
  command: uvx
  args: ["mcp-server-time", "--local-timezone={timezone}"]
  risk: read
