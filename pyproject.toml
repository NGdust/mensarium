[project]
name = "mensarium"
dynamic = ["version"]
description = "Portable Agent Harness: Core (main agent) and clients"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "questionary>=2.0",
    "rich>=13.7",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
]

[project.scripts]
mensarium = "mensarium.cli.main:app"

[dependency-groups]
dev = ["mypy>=1.11", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/__init__.py"

# the code lives directly in src/ and is installed as the `mensarium` package
[tool.hatch.build.targets.wheel]
only-include = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = "mensarium"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM105", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["mensarium"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
